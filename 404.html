<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>404 Página Não Encontrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #1f2937; /* Tailwind gray-800 */
      color: #d1d5db; /* Tailwind gray-300 */
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
    }
    @keyframes subtle-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.85;
        transform: scale(1.05);
      }
    }
    .animate-subtle-pulse {
      animation: subtle-pulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <header class="bg-gray-900 shadow-md">
    <nav
      class="container mx-auto px-4 py-4 flex items-center justify-between"
      aria-label="Main Navigation"
    >
      <a
        class="text-3xl font-bold text-indigo-400 hover:text-indigo-300 transition-colors"
        href="#"
        >ZIPPY</a
      >
    </nav>
  </header>
  <main
    class="flex-grow flex flex-col items-center justify-center px-6 text-center max-w-xl mx-auto"
  >
    <h1
      class="text-8xl font-extrabold text-indigo-400 mb-6 animate-subtle-pulse select-none"
      aria-label="Erro 404"
    >
      404
    </h1>
    <p class="text-xl text-gray-300 leading-relaxed">
      Oops! A página que você está procurando não existe ou foi movida.
    </p>
  </main>
  <footer class="bg-gray-900 shadow-inner py-6 mt-12 text-center text-gray-400 text-sm">
    &copy; 2024 ZIPPY. Todos os direitos reservados.
  </footer>
</body>
</html>
